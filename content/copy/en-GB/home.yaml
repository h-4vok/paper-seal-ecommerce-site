manifesto:
  eyebrow: The Paper Seal Studio, East Sussex
  heading: For familiar places that stay with you.
  paragraphs:
    - 'There is beauty in the places we pass every day: the pier in changing light, chalk cliffs after rain, a harbour settling into evening. The Paper Seal Studio turns those moments into prints with colour, warmth and a little wonder.'
    - Made for rooms that are collected rather than styled, each piece is a small reminder that good art and meaningful places belong in everyday homes.
  stamp: Always a good idea
paperQuality:
  eyebrow: Paper & quality
  heading: The paper makes the difference.
  body: Every Paperseal print is made on Hahnemühle German Etching. Its softly textured, matt surface gives our colour-rich local scenes depth and a tactile presence we want people to enjoy at home.
  attributes:
    - 310 gsm
    - Softly textured
    - Matt finish
  imageAlt: Editorial interpretation of textured fine art paper beside a colourful landscape print
  imageCaption: A visual interpretation of German Etching's textured surface.
