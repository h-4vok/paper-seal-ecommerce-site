  eyebrow: The Paper Seal Studio, East Sussex
  heading: For familiar places that stay with you.
  paragraphs:
    - 'There is beauty in the places we pass every day: the pier in changing light, chalk cliffs after rain, a harbour settling into evening. The Paper Seal Studio turns those moments into prints with colour, warmth and a little wonder.'
