pages:
  - slug: our-story
    eyebrow: Our story
    heading: Made by looking closer.
    description: The Paper Seal Studio is an independent collection of art prints rooted in Eastbourne and the places around it.
    indexable: true
    sections:
      - heading: A local point of view
        paragraphs:
          - 'The Paper Seal Studio starts with familiar places: a seafront garden, chalk cliffs, a harbour, a street on the way home. The work is about noticing what is already here and giving it room to be seen again.'
      - heading: From scene to print
        paragraphs:
          - 'Each piece moves through observation, selection, making, refinement and presentation. The result is intended to feel personal in a home: recognisable without becoming ordinary, and carefully composed without feeling distant.'
      - id: paper-and-quality
        heading: Paper and quality
        paragraphs:
          - 'We choose Hahnemühle German Etching for every Paperseal print. This 310 gsm fine art paper has a soft, felt-like texture and a matt surface that give our colour-rich scenes a quiet sense of depth.'
          - 'Its surface lets detail and colour remain clear while the paper itself feels substantial in the hand. That balance suits the familiar East Sussex places we make prints of: expressive enough to catch the eye, gentle enough to live with every day.'
      - heading: The collection grows slowly
        paragraphs:
          - This first collection introduces a local selection. More places and stories will join it as they are ready; the catalogue will remain a considered collection rather than an endless feed.
  - slug: delivery
    eyebrow: Delivery
    heading: Clear notes on delivery.
    description: Delivery information for The Paper Seal Studio art prints, with some purchasing details still under review.
    status: Delivery options, charges and destinations are still being finalised. Check the options shown at checkout before placing an order.
    indexable: true
    sections:
      - heading: Dispatch timing
        paragraphs:
          - The intended dispatch timeframe for in-stock variants is “Dispatched within 2–3 working days”. This timeframe does not apply to sold-out work; check the confirmed details before ordering.
      - heading: No invented thresholds
        paragraphs:
          - The Paper Seal Studio has not approved a delivery fee or free-delivery threshold for the online shop. Those details will appear here only when they are confirmed.
      - heading: Questions
        paragraphs:
          - A confirmed public contact channel is still being prepared. It will be linked from this page when it is ready.
