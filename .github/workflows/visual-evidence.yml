name: Visual evidence

on:
  pull_request:
    branches: [staging]

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.10 }
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run capture:visual
        env:
          DEPLOY_PRIME_URL: https://deploy-preview-${{ github.event.pull_request.number }}--stunning-bienenstitch-2dd577.netlify.app
      - uses: actions/upload-artifact@v4
        with:
          name: deploy-preview-screenshots
          path: visual-evidence/
