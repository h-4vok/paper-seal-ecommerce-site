name: Visual evidence

on:
  pull_request:
    branches: [staging]

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.10 }
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run build
      - run: bun run build-storybook
      - run: bun run preview -- --host 127.0.0.1 >/tmp/site-preview.log 2>&1 &
      - run: python3 -m http.server 6006 --directory storybook-build >/tmp/storybook.log 2>&1 &
      - run: bun run capture:visual
        env:
          DEPLOY_PRIME_URL: http://127.0.0.1:4321
          STORYBOOK_URL: http://127.0.0.1:6006
      - uses: actions/upload-artifact@v4
        with:
          name: deploy-preview-screenshots
          path: visual-evidence/
