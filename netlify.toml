[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.13.0"
  NPM_FLAGS = "--version"

[context.deploy-preview]
  command = "bun run build"

[context.branch-deploy]
  command = "bun run build"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
